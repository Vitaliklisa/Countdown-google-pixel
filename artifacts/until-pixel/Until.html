<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Count the years, months, days, and hours until a day that matters." />
  <title>Until</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0c0b'/%3E%3Ccircle cx='16' cy='16' r='8.4' fill='none' stroke='%23f2efe8' stroke-width='2.2'/%3E%3Cpath d='M16 10.1v6.15l3.9 2.4' fill='none' stroke='%23f2efe8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --canvas: #080808;
      --bg: #0c0c0b;
      --surface: #161614;
      --surface-2: #1f1f1c;
      --fg: #f2efe8;
      --muted: #9a968c;
      --subtle: #6e6b64;
      --accent: #d8d3c8;
      --accent-fg: #0c0c0b;
      --border: #2a2a26;
      --danger: #c45c4a;
      --font-sans: "Figtree", "Segoe UI", system-ui, sans-serif;
      --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
      --radius-md: 0.75rem;
      --radius-lg: 1.25rem;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      background: var(--canvas);
      color: var(--fg);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button {
      cursor: pointer;
      border: 0;
      background: none;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    h1 { text-wrap: balance; margin: 0; }
    p { text-wrap: pretty; }
    .shell {
      min-height: 100dvh;
      width: 100%;
      max-width: 27rem;
      margin: 0 auto;
      background: var(--bg);
    }
    @media (min-width: 48rem) {
      .shell { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    }
    .screen { display: flex; flex-direction: column; min-height: 100dvh; }
    .pad-x { padding-left: 1.5rem; padding-right: 1.5rem; }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
    }
    .brand span {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .display {
      font-family: var(--font-display);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 3rem;
      padding: 0 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      transition: opacity 150ms var(--ease), transform 150ms var(--ease);
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { width: 100%; background: var(--accent); color: var(--accent-fg); }
    .btn-ghost {
      width: 3rem;
      min-width: 3rem;
      padding: 0;
      color: var(--fg);
    }
    .btn-outline {
      flex: 1;
      border: 1px solid var(--border);
      color: var(--fg);
    }
    .btn-danger { flex: 1; background: var(--danger); color: var(--fg); }
    .icon-btn { color: var(--muted); }
    .grow { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1.25rem 0.75rem;
    }
    .tile .n {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 10vw, 4rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }
    .tile .l {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .row {
      width: 100%;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      text-align: left;
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
    }
    .row:active { background: var(--surface-2); }
    .field { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.875rem; font-weight: 500; color: var(--muted); }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 0 1rem;
      font-size: 1rem;
      outline: none;
    }
    input { height: 3rem; }
    textarea { min-height: 7rem; padding: 0.75rem 1rem; resize: none; }
    input:focus, textarea:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
    .error { color: var(--danger); font-size: 0.875rem; }
    .confirm {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1rem;
    }
    .hidden { display: none !important; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .safe-top { padding-top: max(1.25rem, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }
    .composer-head {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: max(0.75rem, env(safe-area-inset-top)) 0.75rem 0.5rem;
    }
    .composer-head h1 { flex: 1; font-size: 1rem; font-weight: 500; }
    .sticky-bar {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      padding-top: 0.75rem;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell" id="app"></div>
  <script>
    const STORAGE_KEY = "until.events.v1";
    const UNITS = [
      { key: "years", label: "years" },
      { key: "months", label: "months" },
      { key: "days", label: "days" },
      { key: "hours", label: "hours" },
    ];

    const clockSvg = `<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.25" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M9 5.2v4.1l2.6 1.6" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const plusSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
    const pencilSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
    const backSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`;
    const trashSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;

    const state = {
      events: [],
      selectedId: null,
      view: "home",
      editingId: null,
      confirmDelete: false,
      error: null,
      form: { title: "", description: "", date: "", time: "18:00" },
      now: new Date(),
    };

    function pad2(n) { return String(Math.max(0, n)).padStart(2, "0"); }

    function addYears(d, n) { const r = new Date(d); r.setFullYear(r.getFullYear() + n); return r; }
    function addMonths(d, n) { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; }
    function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

    function remainingUntil(target, now) {
      const totalMs = target.getTime() - now.getTime();
      if (Number.isNaN(totalMs) || totalMs <= 0) {
        return { years: 0, months: 0, days: 0, hours: 0, minutes: 0, seconds: 0, isPast: true };
      }
      let years = target.getFullYear() - now.getFullYear();
      if (addYears(now, years) > target) years -= 1;
      const afterYears = addYears(now, years);
      let months = (target.getFullYear() - afterYears.getFullYear()) * 12 + (target.getMonth() - afterYears.getMonth());
      if (addMonths(afterYears, months) > target) months -= 1;
      const afterMonths = addMonths(afterYears, months);
      const days = Math.trunc((target - afterMonths) / 86400000);
      const afterDays = addDays(afterMonths, days);
      const hours = Math.trunc((target - afterDays) / 3600000);
      const afterHours = new Date(afterDays.getTime() + hours * 3600000);
      const minutes = Math.trunc((target - afterHours) / 60000);
      const afterMinutes = new Date(afterHours.getTime() + minutes * 60000);
      const seconds = Math.trunc((target - afterMinutes) / 1000);
      return { years, months, days, hours, minutes, seconds, isPast: false };
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&")
        .replaceAll("<", "<")
        .replaceAll(">", ">")
        .replaceAll('"', """);
    }

    function formatLong(d) {
      return d.toLocaleString(undefined, {
        weekday: "long", month: "long", day: "numeric", year: "numeric",
        hour: "numeric", minute: "2-digit",
      }).replace(" at ", " · ");
    }

    function formatShort(d) {
      return d.toLocaleString(undefined, {
        month: "short", day: "numeric", year: "numeric",
        hour: "numeric", minute: "2-digit",
      }).replace(" at ", " · ");
    }

    function toLocalParts(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return { date: "", time: "18:00" };
      return {
        date: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`,
        time: `${pad2(d.getHours())}:${pad2(d.getMinutes())}`,
      };
    }

    function fromLocalParts(date, time) {
      if (!date) return null;
      const d = new Date(`${date}T${time || "00:00"}:00`);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function defaultDate(now) {
      const d = new Date(now.getTime());
      d.setDate(d.getDate() + 30);
      d.setHours(18, 0, 0, 0);
      return toLocalParts(d.toISOString());
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.events)) return;
        state.events = parsed.events.filter((e) => e && e.id && e.title && !Number.isNaN(new Date(e.at).getTime()));
        state.selectedId = parsed.selectedId && state.events.some((e) => e.id === parsed.selectedId)
          ? parsed.selectedId : null;
      } catch (_) { /* keep empty */ }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        events: state.events,
        selectedId: state.selectedId,
      }));
    }

    function pickFeatured() {
      const { events, selectedId, now } = state;
      if (!events.length) return null;
      if (selectedId) {
        const selected = events.find((e) => e.id === selectedId);
        if (selected) return selected;
      }
      const upcoming = events
        .filter((e) => new Date(e.at).getTime() > now.getTime())
        .sort((a, b) => new Date(a.at) - new Date(b.at));
      if (upcoming[0]) return upcoming[0];
      return [...events].sort((a, b) => new Date(b.at) - new Date(a.at))[0];
    }

    function brand() {
      return `<div class="brand">${clockSvg}<span>Until</span></div>`;
    }

    function renderHome() {
      const featured = pickFeatured();
      if (!featured) {
        return `
          <section class="screen">
            <header class="header safe-top">${brand()}</header>
            <div class="grow pad-x">
              <h1 class="display" style="font-size:2.25rem">Name a day.</h1>
              <p class="muted" style="margin-top:1rem;max-width:20rem">
                Choose a future moment. Until will count the years, months, days, and hours left.
              </p>
            </div>
            <div class="pad-x safe-bottom">
              <button class="btn btn-primary" data-action="compose">${plusSvg} Create event</button>
            </div>
          </section>`;
      }
      const target = new Date(featured.at);
      const rem = remainingUntil(target, state.now);
      const past = rem.isPast;
      const others = state.events.filter((e) => e.id !== featured.id);
      const tiles = UNITS.map((u) => `
        <div class="tile"><span class="n">${pad2(rem[u.key])}</span><span class="l">${u.label}</span></div>
      `).join("");
      const list = others.length ? `
        <div style="margin-top:2rem;margin-bottom:1rem">
          <p class="subtle" style="margin:0 0 0.75rem;font-size:0.75rem;font-weight:500;letter-spacing:0.18em;text-transform:uppercase">Other events</p>
          ${others.map((e) => {
            const when = new Date(e.at);
            const gone = when.getTime() <= state.now.getTime();
            return `<button class="row" data-action="select" data-id="${escapeHtml(e.id)}">
              <span class="truncate" style="min-width:0">
                <span class="truncate" style="display:block;font-size:0.875rem;font-weight:500">${escapeHtml(e.title)}</span>
                <span class="truncate muted" style="display:block;font-size:0.75rem">${escapeHtml(formatShort(when))}</span>
              </span>
              <span class="subtle" style="flex-shrink:0;font-size:0.75rem">${gone ? "Passed" : "Upcoming"}</span>
            </button>`;
          }).join("")}
        </div>` : `<div style="flex:1"></div>`;

      return `
        <section class="screen">
          <header class="header safe-top" style="padding-bottom:1rem">
            ${brand()}
            <button class="btn btn-ghost icon-btn" data-action="edit" aria-label="Edit event">${pencilSvg}</button>
          </header>
          <div class="pad-x" style="flex:1;display:flex;flex-direction:column">
            <p class="subtle" style="margin:0;font-size:0.75rem;font-weight:500;letter-spacing:0.18em;text-transform:uppercase">${past ? "Arrived" : "Counting down"}</p>
            <h1 class="display" style="margin-top:0.5rem;font-size:1.875rem">${escapeHtml(featured.title)}</h1>
            ${featured.description ? `<p class="muted" style="margin:0.5rem 0 0;font-size:0.875rem">${escapeHtml(featured.description)}</p>` : ""}
            <p class="subtle" style="margin:0.75rem 0 0;font-size:0.875rem">${escapeHtml(formatLong(target))}</p>
            <div class="grid-2" style="margin-top:2rem">${tiles}</div>
            <p style="text-align:center;margin:1rem 0 0;font-size:0.875rem;font-variant-numeric:tabular-nums" class="muted">
              ${past ? "This day has arrived." : `${pad2(rem.minutes)} min · ${pad2(rem.seconds)} sec`}
            </p>
            ${list}
          </div>
          <div class="sticky-bar pad-x safe-bottom">
            <button class="btn btn-primary" data-action="compose">${plusSvg} New event</button>
          </div>
        </section>`;
    }

    function renderComposer() {
      const editing = state.editingId ? state.events.find((e) => e.id === state.editingId) : null;
      const min = `${state.now.getFullYear()}-${pad2(state.now.getMonth() + 1)}-${pad2(state.now.getDate())}`;
      const f = state.form;
      return `
        <section class="screen">
          <header class="composer-head">
            <button class="btn btn-ghost" data-action="home" aria-label="Back">${backSvg}</button>
            <h1>${editing ? "Edit event" : "New event"}</h1>
            ${editing
              ? `<button class="btn btn-ghost icon-btn" data-action="ask-delete" aria-label="Delete event">${trashSvg}</button>`
              : `<span style="width:3rem;height:3rem"></span>`}
          </header>
          <div class="pad-x" style="flex:1;display:flex;flex-direction:column;gap:1.25rem;padding-top:0.5rem">
            <div class="field">
              <label for="event-title">Title</label>
              <input id="event-title" maxlength="80" placeholder="Wedding, launch, reunion" autocomplete="off" value="${escapeHtml(f.title)}" />
            </div>
            <div class="field">
              <label for="event-description">Description</label>
              <textarea id="event-description" maxlength="280" placeholder="A short note about the day">${escapeHtml(f.description)}</textarea>
            </div>
            <div class="grid-2">
              <div class="field">
                <label for="event-date">Date</label>
                <input id="event-date" type="date" min="${min}" value="${escapeHtml(f.date)}" />
              </div>
              <div class="field">
                <label for="event-time">Time</label>
                <input id="event-time" type="time" value="${escapeHtml(f.time)}" />
              </div>
            </div>
            ${state.error ? `<p class="error" role="alert">${escapeHtml(state.error)}</p>` : ""}
            ${state.confirmDelete ? `
              <div class="confirm">
                <p style="margin:0;font-size:0.875rem">Delete this event? The countdown cannot be undone.</p>
                <div style="display:flex;gap:0.5rem;margin-top:0.75rem">
                  <button class="btn btn-outline" data-action="keep">Keep</button>
                  <button class="btn btn-danger" data-action="delete">Delete</button>
                </div>
              </div>` : ""}
          </div>
          <div class="pad-x safe-bottom" style="padding-top:0.5rem">
            <button class="btn btn-primary" data-action="save">${editing ? "Save changes" : "Create event"}</button>
          </div>
        </section>`;
    }

    function readForm() {
      const title = document.querySelector("#event-title");
      const description = document.querySelector("#event-description");
      const date = document.querySelector("#event-date");
      const time = document.querySelector("#event-time");
      if (!title) return;
      state.form = {
        title: title.value,
        description: description.value,
        date: date.value,
        time: time.value,
      };
    }

    function render() {
      const root = document.getElementById("app");
      root.innerHTML = state.view === "compose" ? renderComposer() : renderHome();
    }

    function openCompose(editId) {
      state.view = "compose";
      state.editingId = editId || null;
      state.confirmDelete = false;
      state.error = null;
      const editing = editId ? state.events.find((e) => e.id === editId) : null;
      if (editing) {
        const local = toLocalParts(editing.at);
        state.form = { title: editing.title, description: editing.description, date: local.date, time: local.time };
      } else {
        const d = defaultDate(state.now);
        state.form = { title: "", description: "", date: d.date, time: d.time };
      }
      render();
    }

    function saveEvent() {
      readForm();
      const title = state.form.title.trim();
      if (!title) { state.error = "Give this event a title."; render(); return; }
      const when = fromLocalParts(state.form.date, state.form.time);
      if (!when) { state.error = "Choose a date and time."; render(); return; }
      if (when.getTime() <= Date.now()) { state.error = "Pick a moment still ahead of you."; render(); return; }
      const draft = {
        title,
        description: state.form.description.trim(),
        at: when.toISOString(),
      };
      if (state.editingId) {
        state.events = state.events.map((e) => e.id === state.editingId ? { ...e, ...draft } : e);
      } else {
        const id = crypto.randomUUID ? crypto.randomUUID() : `evt_${Date.now()}`;
        const event = { id, ...draft, createdAt: new Date().toISOString() };
        state.events = [event, ...state.events];
        state.selectedId = id;
      }
      persist();
      state.view = "home";
      state.editingId = null;
      state.error = null;
      render();
    }

    function deleteEvent() {
      state.events = state.events.filter((e) => e.id !== state.editingId);
      if (state.selectedId === state.editingId) {
        state.selectedId = state.events[0] ? state.events[0].id : null;
      }
      persist();
      state.view = "home";
      state.editingId = null;
      state.confirmDelete = false;
      render();
    }

    document.getElementById("app").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.getAttribute("data-action");
      if (state.view === "compose") readForm();
      if (action === "compose") openCompose(null);
      else if (action === "edit") {
        const featured = pickFeatured();
        if (featured) openCompose(featured.id);
      }
      else if (action === "home") { state.view = "home"; state.editingId = null; render(); }
      else if (action === "save") saveEvent();
      else if (action === "select") { state.selectedId = btn.getAttribute("data-id"); persist(); render(); }
      else if (action === "ask-delete") { state.confirmDelete = true; render(); }
      else if (action === "keep") { state.confirmDelete = false; render(); }
      else if (action === "delete") deleteEvent();
    });

    load();
    render();
    setInterval(() => {
      state.now = new Date();
      if (state.view === "home") render();
    }, 1000);
  </script>
</body>
</html>
